# Project-wide Gradle settings.

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting max heap size to 4GB (4096m) to solve Java heap space OutOfMemoryError.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true

# Enables parallel build execution
org.gradle.parallel=true

# Enables caching of task outputs across builds
org.gradle.caching=true
